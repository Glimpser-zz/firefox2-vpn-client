name: firefox_vpn
description: "Cross-platform shell for the Go VPN core"
publish_to: 'none'

version: 1.0.7+128

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  intl: any

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    - assets/logo.webp
    - assets/logo.png
    - assets/tray/
    - assets/flags/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
